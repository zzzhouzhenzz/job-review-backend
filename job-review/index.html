  <header class="masthead">
    <div><button class="brand" data-view="cards">Job review</button><span class="save-state" id="save-state" role="status"><span class="status-dot"></span>Loading…</span></div>
    <nav class="top-nav" aria-label="Main views"><button class="button" data-view="cards" id="review-tab">Review</button><button class="button" data-view="ready" id="saved-tab">Saved</button><button class="button" id="browse-toggle" data-action="toggle-browse" aria-expanded="false" aria-controls="browse-panel">Browse</button></nav>
  </header>

    <div class="feed-tools"><label class="search-wrap"><span class="sr-only">Search by company or job title</span><svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.7"/></svg><input class="search" id="search" type="search" placeholder="Search companies or jobs" autocomplete="off" data-testid="search"></label><label><span class="sr-only">Filter by company</span><select class="company-filter" id="company-filter" data-testid="company-filter"><option value="">All companies</option></select></label></div>

  </section>
  <div class="layout"><main class="feed" id="main" tabindex="-1"><div id="notice" aria-live="polite"></div><div id="content"><div class="loading">Opening your review…</div></div><footer class="footer">Choices save on this computer. This page does not send applications.</footer></main></div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const text = escapeHTML;
const safeURL = value => {try {const u = new URL(value);return u.protocol === 'https:' ? u.href : null;} catch {return null;}};
const link = (url,label) => safeURL(url) ? `<a href="${text(safeURL(url))}" target="_blank" rel="noopener noreferrer">${text(label)}</a>` : text(label);
const viewKey = 'job-inbox-view-v3';
const cardKey = 'job-inbox-pending-card-v1';
const queueKey = 'job-inbox-pending-queue-v1';
let tabId;
try{tabId=sessionStorage.getItem('job-inbox-tab-v1');if(!tabId){tabId=crypto.randomUUID();sessionStorage.setItem('job-inbox-tab-v1',tabId);}}catch{tabId=crypto.randomUUID();}
const notesKey = 'job-inbox-unsaved-notes-v1:'+tabId;
const views = ['cards','inbox','later','ready','queue','all','excluded'];
let savedView = {};
try {savedView = JSON.parse(localStorage.getItem(viewKey) || '{}');} catch {}
let state = null, online = false, busy = false, loading = false, chain = Promise.resolve(), generation = 0;
let view = views.includes(savedView.view) ? savedView.view : 'cards';
let search = typeof savedView.search === 'string' ? savedView.search : '';
let companyFilter = typeof savedView.company === 'string' ? savedView.company : '';
let limit = Math.max(20,Math.min(200,Number(savedView.limit) || 20));
let selected = new Set(), preview = null, notice = null, pendingQueue = null;
let cardSelected = new Set(), currentCard = null, pendingCard = null, browseOpen = false, swipe = null;
try {pendingCard = JSON.parse(localStorage.getItem(cardKey) || 'null');} catch {}
const noteDrafts = new Map(), noteRevisions = new Map(), noteTimers = new Map(), openedDetails = new Set();
try {for(const [key,record] of Object.entries(JSON.parse(localStorage.getItem(notesKey)||'{}'))){if(typeof record.value==='string'&&Number.isInteger(record.revision)){noteDrafts.set(key,record.value);noteRevisions.set(key,record.revision);}}} catch {}
try {pendingQueue = JSON.parse(localStorage.getItem(queueKey) || 'null');} catch {}
const activeStatuses = new Set(['queued','in_progress','needs_input','applied']);
const statusLabels = {queued:'Queued',in_progress:'In progress',needs_input:'Needs your input',applied:'Applied',failed:'Failed',done:'Done',cancelled:'Cancelled',stale:'Needs new review'};
const titles = {cards:'Review',inbox:'Inbox',later:'Later',ready:'Ready',queue:'Work queue',all:'All jobs',excluded:'Excluded companies'};
const descriptions = {cards:'One company. Up to three jobs. One decision.',inbox:'New jobs and jobs that need a new review.',later:'Jobs you want to review another day.',ready:'Approved jobs. Choose a subset to queue.',queue:'Saved work and its current status.',all:'Every job, including prior decisions.',excluded:'These companies stay excluded when more jobs arrive.'};
function company(id){return state?.companies.find(c=>c.id===id);}
function job(key){return state?.jobs.find(j=>j.key===key);}
function queueFor(key){return state?.queue.filter(q=>q.kind==='application'&&q.job_key===key&&activeStatuses.has(q.status)).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];}
function available(j){return !company(j.company_id)?.excluded&&!queueFor(j.key);}
function isReady(j){return available(j)&&j.decision==='approve';}
function counts(){if(!state)return Object.fromEntries(views.map(v=>[v,0]));return {cards:state.flashcards?.length||0,inbox:state.jobs.filter(j=>available(j)&&j.decision==='pending').length,later:state.jobs.filter(j=>available(j)&&j.decision==='later').length,ready:state.jobs.filter(isReady).length,queue:state.queue.filter(q=>['queued','in_progress','needs_input'].includes(q.status)).length,all:state.jobs.length,excluded:state.companies.filter(c=>c.excluded).length};}
function persistView(){try{localStorage.setItem(viewKey,JSON.stringify({view,search,company:companyFilter,limit,scroll:window.scrollY}));}catch{}}
function persistNotes(){try{localStorage.setItem(notesKey,JSON.stringify(Object.fromEntries([...noteDrafts].map(([key,value])=>[key,{value,revision:noteRevisions.get(key)}]))));}catch{setSaveState('Note backup unavailable',true);}}
function clearDraft(key){noteDrafts.delete(key);noteRevisions.delete(key);persistNotes();}
function acceptNoteSave(key,value){if(noteDrafts.get(key)===value)clearDraft(key);else if(noteDrafts.has(key)){const item=key.startsWith('job:')?job(key.slice(4)):company(key.slice(8));if(item)noteRevisions.set(key,item.revision);persistNotes();}}
function persistPending(){try{if(pendingQueue)localStorage.setItem(queueKey,JSON.stringify(pendingQueue));else localStorage.removeItem(queueKey);}catch{}}
function date(value){if(!value)return 'Date not recorded';const d=new Date(value);return Number.isNaN(d.getTime())?String(value):d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});}
function setNotice(message,kind='error'){notice={message,kind};renderNotice();}
function renderNotice(){let html='';if(notice)html=`<div class="banner ${text(notice.kind)}"><p>${text(notice.message)}</p><button class="button quiet small" data-action="dismiss" aria-label="Dismiss message">Dismiss</button></div>`;if(pendingCard)html+=`<div class="banner"><p>A card decision needs a check. Check the saved result before you continue.</p><button class="button small" data-action="recover-card"${!online||busy||loading?' disabled':''}>Check card decision</button></div>`;if(pendingQueue)html+=`<div class="banner"><p>A queue request needs a check. Retry the same request to confirm its result.</p><button class="button small" data-action="recover-queue"${!online||busy?' disabled':''}>Check queue request</button></div>`;if(noteDrafts.size)html+=`<div class="banner"><p>${noteDrafts.size} unsaved ${noteDrafts.size===1?'note':'notes'} kept in this tab. Save your edits or discard them before you make another decision. Saving replaces the current note.</p><div><button class="button small" data-action="save-notes"${!online||busy||loading?' disabled':''}>Save my notes</button> <button class="button quiet small" data-action="discard-notes"${busy?' disabled':''}>Discard edits</button></div></div>`;$('notice').innerHTML=html;}
function setSaveState(message,failed=false){if(message==='Saved on this computer')message='Saved';$('save-state').classList.toggle('error',failed);$('save-state').innerHTML=`<span class="status-dot"></span>${text(message)}`;}
function disabled(){return !online||busy||loading?' disabled':'';}
function renderNav(){$('app').dataset.view=view;$('browse-panel').hidden=!browseOpen;$('browse-toggle').setAttribute('aria-expanded',String(browseOpen));$('review-tab').setAttribute('aria-current',view==='cards'?'page':'false');$('saved-tab').setAttribute('aria-current',view==='ready'?'page':'false');const c=counts();$('nav').innerHTML=views.map(v=>`<button data-view="${v}" data-testid="filter-${v}"${view===v?' aria-current="page"':''}><span>${v==='queue'?'Queue':titles[v]}</span><span class="count">${c[v]}</span></button>`).join('');}
function renderCompanySelect(){if(!state)return;const prev=$('company-filter').value;const companies=[...state.companies].sort((a,b)=>a.name.localeCompare(b.name));$('company-filter').innerHTML='<option value="">All companies</option>'+companies.map(c=>`<option value="${text(c.id)}">${text(c.name)}${c.excluded?' · excluded':''}</option>`).join('');if(companyFilter&&!company(companyFilter))companyFilter='';$('company-filter').value=companyFilter;}
function rememberFocus(){const a=document.activeElement;if(!a||!$('content').contains(a))return null;return {id:a.id,action:a.dataset.action,key:a.dataset.key,company:a.dataset.company,selection:typeof a.selectionStart==='number'?[a.selectionStart,a.selectionEnd]:null};}
function restoreFocus(f){if(!f)return;let a=f.id?document.getElementById(f.id):null;if(!a&&f.action)a=[...$('content').querySelectorAll('[data-action]')].find(el=>el.dataset.action===f.action&&el.dataset.key===f.key&&el.dataset.company===f.company);if(a){a.focus({preventScroll:true});if(f.selection&&a.setSelectionRange)a.setSelectionRange(...f.selection);}}
function render(){if(!state)return;cancelSwipe();const f=rememberFocus();renderNav();renderCompanySelect();renderNotice();$('refresh').disabled=busy||loading;const imports=state.imports||[];const recent=[...imports].sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))[0];$('import-note').textContent=recent?`Last import: ${date(recent.created_at)}. Refresh to get new jobs.`:'Refresh to get new jobs.';const valid=new Set(state.jobs.filter(isReady).map(j=>j.key));selected=new Set([...selected].filter(k=>valid.has(k)));if(preview&&preview.some(p=>!valid.has(p.key)||job(p.key)?.revision!==p.revision)){preview=null;setNotice('The ready list changed. Check your selection before you queue jobs.','error');}if(view==='cards')renderCards();else if(view==='queue')renderQueue();else if(view==='excluded')renderExcluded();else renderJobs();restoreFocus(f);}
function matchesCompany(id){return !companyFilter||id===companyFilter;}
function matchesQuery(j){const query=search.trim().toLocaleLowerCase();return !query||`${company(j.company_id)?.name||''} ${j.data.title||''}`.toLocaleLowerCase().includes(query);}
function visibleJobs(){if(!state)return [];let jobs=state.jobs.filter(j=>matchesCompany(j.company_id)&&matchesQuery(j));if(view==='inbox')jobs=jobs.filter(j=>available(j)&&j.decision==='pending');else if(view==='later')jobs=jobs.filter(j=>available(j)&&j.decision==='later');else if(view==='ready')jobs=jobs.filter(isReady);const newest=new Map(state.companies.map(c=>[c.id,String(c.first_seen)]));for(const j of state.jobs){if(String(j.first_seen)>newest.get(j.company_id))newest.set(j.company_id,String(j.first_seen));}const companyOrder=new Map([...state.companies].sort((a,b)=>newest.get(b.id).localeCompare(newest.get(a.id))||state.companies.indexOf(a)-state.companies.indexOf(b)).map((c,i)=>[c.id,i]));return jobs.sort((a,b)=>(companyOrder.get(a.company_id)??999)-(companyOrder.get(b.company_id)??999)||(Number(a.data.rank)||999)-(Number(b.data.rank)||999)||String(b.first_seen).localeCompare(String(a.first_seen)));}
function heading(total,label='jobs'){return `<div class="feed-heading"><div><h2>${titles[view]}</h2><p class="feed-caption">${descriptions[view]}</p></div><span class="label">${total} ${total===1?({jobs:'job',entries:'entry',companies:'company'}[label]||label):label}</span></div>`;}
function emptyMessage(){if(search||companyFilter)return `<div class="empty"><h3>No matching jobs.</h3><p>Try another company or clear your search.</p><button class="button" data-action="clear-filters">Clear search and company</button></div>`;const messages={inbox:['You are up to date.','New jobs will appear here after the next import. Jobs in Later will stay there until you return.'],later:['Nothing saved for later.','Select Later on a job to keep it here.'],ready:['No jobs are ready yet.','Approve a job in your inbox. Then return here to choose which jobs to queue.']};const [title,body]=messages[view]||['No jobs yet.','New research will appear here when it is added.'];return `<div class="empty"><h3>${title}</h3><p>${body}</p>${view!=='inbox'?'<button class="button" data-view="inbox">Go to inbox</button>':''}</div>`;}
function renderJobs(){const jobs=visibleJobs(),shown=jobs.slice(0,limit);let html=heading(jobs.length);if(view==='ready'){html+=`<div class="ready-toolbar"><div><strong>${selected.size} selected</strong><p>Only selected jobs enter the queue.</p></div><div class="buttons"><button class="button quiet small" data-action="select-visible"${!jobs.length?' disabled':''}>Select ${shown.length===jobs.length?'all matching':'visible'} jobs</button><button class="button quiet small" data-action="clear-selected"${!selected.size?' disabled':''}>Clear</button><button class="button primary" data-action="preview" data-testid="preview-selected"${!selected.size||!online||busy||loading||noteDrafts.size?' disabled':''}>Review selected jobs</button></div></div>`;if(preview)html+=renderPreview();}if(!jobs.length)html+=emptyMessage();let last=null;for(const j of shown){if(j.company_id!==last){if(last!==null)html+='</section>';html+=companyHeader(company(j.company_id));last=j.company_id;}html+=jobRow(j);}if(last!==null)html+='</section>';if(jobs.length>limit)html+=`<div class="load-more"><button class="button" data-action="load-more" data-testid="load-more">Load ${Math.min(20,jobs.length-limit)} more jobs</button></div>`;$('content').innerHTML=html;}
function companyHeader(c){if(!c)return '<section class="company-group">';const jobs=state.jobs.filter(j=>j.company_id===c.id);const research=state.queue.find(q=>q.kind==='research'&&q.company_id===c.id&&['queued','in_progress','needs_input'].includes(q.status));const note=noteDrafts.get('company:'+c.id)??c.note??'';const open=openedDetails.has('company:'+c.id);return `<section class="company-group" aria-label="${text(c.name)}"><div class="company-heading"><div><h3>${text(c.name)}</h3><div class="company-meta">${jobs.length} ${jobs.length===1?'job':'jobs'} in catalog${c.excluded?' · Company excluded':''}${research?' · Research '+text(statusLabels[research.status].toLowerCase()):''}</div></div><div class="company-actions">${c.excluded?`<button class="button quiet" data-action="restore" data-company="${text(c.id)}"${disabled()}>Restore company</button>`:`<button class="button quiet" data-action="research" data-company="${text(c.id)}"${disabled()||research?' disabled':''}>${research?'Research requested':'Find better jobs'}</button><button class="button quiet danger" data-action="exclude" data-company="${text(c.id)}" title="Exclude company and cancel its queued jobs"${disabled()}>Exclude company</button>`}</div></div><details class="company-context" data-detail="company:${text(c.id)}"${open?' open':''}><summary>Company notes and search scope</summary><div class="context-body">${c.data.summary?`<p>${text(c.data.summary)}</p>`:''}${c.data.coverage?`<p><strong>Search scope:</strong> ${text(c.data.coverage)}</p>`:''}${c.data.comparison?`<p><strong>Why these jobs:</strong> ${text(c.data.comparison)}</p>`:''}${c.data.board_url?`<p>${link(c.data.board_url,'Company job board')}</p>`:''}<p>Excluding a company cancels its queued jobs. Past work stays in the history.</p><label for="company-note-${text(c.id)}">Your note</label><textarea class="note" id="company-note-${text(c.id)}" data-note-kind="company" data-note-id="${text(c.id)}" maxlength="2500"${!online?' disabled':''}>${text(note)}</textarea><p class="note-hint">Notes save as you type.</p></div></details>`;}
function conciseFallback(value){if(Array.isArray(value))return value[0]||'Not recorded.';return value||'Not recorded.';}
function jobRow(j){const d=j.data,c=company(j.company_id),q=queueFor(j.key),b=d.brief||{};const status=q?statusLabels[q.status]:c?.excluded?'Company excluded':({pending:j.changed?'Changed · review again':'',later:'Saved for later',approve:'Ready',pass:'Passed'}[j.decision]||'');const locked=!!q||!!c?.excluded;const tag=/stretch/i.test(d.fit||'')?'stretch':/strong|good/i.test(d.fit||'')?'':'neutral';const note=noteDrafts.get('job:'+j.key)??j.note??'';const detailsId='job:'+j.key;const approved=j.decision==='approve'&&!q;return `<article class="job" data-job="${text(j.key)}">${view==='ready'?`<label class="ready-check"><input type="checkbox" data-select="${text(j.key)}" aria-label="Select ${text(d.title)} at ${text(c?.name)} for the queue"${selected.has(j.key)?' checked':''}${busy?' disabled':''}>Select for queue</label>`:''}<div class="job-top"><div class="job-title-wrap"><div class="job-kicker">${d.rank?`<span class="rank">Rank ${text(d.rank)} at ${text(c?.name)}</span>`:''}${d.fit?`<span class="fit-tag ${tag}">${text(d.fit)}</span>`:''}</div><h4>${link(d.url,d.title||'Untitled role')}</h4></div>${status?`<span class="job-status ${['pass','later'].includes(j.decision)||c?.excluded?'muted':j.changed||q?.status==='needs_input'?'warn':''}">${text(status)}</span>`:''}</div><div class="job-meta"><span>${text(d.location||'Location not listed')}</span><span>${text(d.salary||'Pay not listed')}</span><span class="arrangement">${text(b.arrangement||d.arrangement||'Work setting not confirmed.')}</span></div><dl class="brief"><dt>Work</dt><dd>${text(b.work||conciseFallback(d.why_ranked))}</dd><dt>Fit</dt><dd>${text(b.fit||conciseFallback(d.strengths))}</dd><dt>Gap</dt><dd class="gap">${text(b.gap||conciseFallback(d.gaps))}</dd></dl><div class="job-actions">${q?`<button class="button small" data-view="queue">View ${q.status==='applied'?'history':'queue'}</button>`:c?.excluded?'<span class="note-hint">Restore this company to review its jobs.</span>':`<button class="button small ${approved?'selected':''}" data-action="decision" data-key="${text(j.key)}" data-decision="approve" aria-pressed="${approved}" data-testid="approve-${text(j.key)}"${disabled()}>${approved?'Approved':'Approve'}</button><button class="button small ${j.decision==='later'?'selected':''}" data-action="decision" data-key="${text(j.key)}" data-decision="later" aria-pressed="${j.decision==='later'}"${disabled()}>Later</button><button class="button small ${j.decision==='pass'?'selected':''}" data-action="decision" data-key="${text(j.key)}" data-decision="pass" aria-pressed="${j.decision==='pass'}"${disabled()}>Pass</button>${j.decision!=='pending'?`<button class="button quiet small" data-action="decision" data-key="${text(j.key)}" data-decision="pending"${disabled()}>Reset</button>`:''}`}</div><details class="job-details" data-detail="${text(detailsId)}"${openedDetails.has(detailsId)?' open':''}><summary>Full details and sources</summary><div class="details-body"><dl class="facts"><dt>Job ID</dt><dd>${text(j.job_id||d.job_id)}</dd><dt>Work setting</dt><dd>${text(d.arrangement||'Not confirmed.')}</dd><dt>Level</dt><dd>${text(d.level||'Not confirmed.')}</dd><dt>Why this rank</dt><dd>${text(d.why_ranked||'Not recorded.')}</dd><dt>Strengths</dt><dd>${list(d.strengths)}</dd><dt>Gaps</dt><dd>${list(d.gaps)}</dd><dt>Availability</dt><dd>${text(d.availability||'Check the live posting before applying.')}</dd><dt>Checked</dt><dd>${text(c?.data.checked_date||'Not recorded')}</dd><dt>Sources</dt><dd class="sources">${(d.sources||[]).map(s=>link(s.url,s.label||'Source')).join('')||link(d.url,'Official job posting')}</dd></dl><label class="note-label" for="job-note-${text(j.key)}">Your note</label><textarea class="note" id="job-note-${text(j.key)}" data-note-kind="job" data-note-id="${text(j.key)}" maxlength="2500"${!online||locked?' disabled':''}>${text(note)}</textarea><p class="note-hint">${locked?'This note is read only while the job is locked.':'Notes save as you type.'}</p></div></details></article>`;}
function list(items){return Array.isArray(items)&&items.length?'<ul>'+items.map(s=>`<li>${text(s)}</li>`).join('')+'</ul>':text(items||'Not recorded.');}
function renderPreview(){const rows=preview.map(p=>job(p.key)).filter(Boolean);return `<section class="preview" id="queue-preview" tabindex="-1" aria-label="Review queue selection"><h3>${rows.length===1?'Queue this job?':'Queue these '+rows.length+' jobs?'}</h3><p>These exact jobs will be saved to your work queue. Return to this chat to start. No application is sent from this page.</p><ul class="preview-list">${rows.map(j=>`<li><strong>${text(company(j.company_id)?.name)}</strong>${link(j.data.url,j.data.title)}<small>${text(j.data.location)} · ID ${text(j.job_id)}</small></li>`).join('')}</ul><div class="preview-actions"><button class="button primary" data-action="queue" data-testid="queue-selected"${disabled()||pendingQueue||noteDrafts.size?' disabled':''}>Queue selected jobs</button><button class="button quiet" data-action="close-preview"${busy?' disabled':''}>Back to selection</button></div></section>`;}
function renderQueue(){let entries=[...state.queue].filter(q=>matchesCompany(q.company_id));if(search.trim()){const s=search.trim().toLowerCase();entries=entries.filter(q=>`${company(q.company_id)?.name||''} ${q.snapshot?.title||''} ${q.kind==='research'?'research':''}`.toLowerCase().includes(s));}entries.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));let html=heading(entries.length,'entries');html+='<p class="history-note">Queued work has not started. Return to this chat when you want to start. Cancel is available until work starts.</p>';if(!entries.length)html+=`<div class="empty"><h3>${search||companyFilter?'No matching work.':'Your queue is empty.'}</h3><p>${search||companyFilter?'Clear the search or choose another company.':'Choose approved jobs in Ready, or request more research for a company.'}</p><button class="button" data-view="ready">Open Ready</button></div>`;for(const q of entries.slice(0,limit)){const d=q.snapshot||{};const tone=['needs_input','failed','stale'].includes(q.status)?'warn':['cancelled','done'].includes(q.status)?'muted':'';html+=`<article class="queue-row"><div><div class="queue-kicker">${text(company(q.company_id)?.name||q.company_id)} · ${q.kind==='research'?'Company research':'Application'}</div><h3>${q.kind==='research'?'Find better jobs':link(d.url,d.title||'Job title not recorded')}</h3><p class="queue-meta">${q.kind==='application'?text(d.location||'Location not recorded')+' · ':''}Saved ${text(date(q.created_at))}</p>${q.status==='stale'?'<p class="queue-note">The posting changed. Review the current job before you approve it again.</p>':''}${q.note?`<p class="queue-note">${text(q.note)}</p>`:''}</div><div><div class="queue-status ${tone}">${text(statusLabels[q.status]||q.status)}</div>${q.status==='queued'?`<button class="button small" data-action="cancel" data-queue-id="${text(q.id)}"${disabled()}>Cancel ${q.kind==='research'?'research':'job'}</button>`:''}</div></article>`;}if(entries.length>limit)html+=`<div class="load-more"><button class="button" data-action="load-more">Load more work</button></div>`;$('content').innerHTML=html;}
function renderExcluded(){let companies=state.companies.filter(c=>c.excluded&&matchesCompany(c.id));if(search.trim())companies=companies.filter(c=>c.name.toLowerCase().includes(search.trim().toLowerCase()));let html=heading(companies.length,'companies');if(!companies.length)html+=`<div class="empty"><h3>No excluded companies.</h3><p>Exclude a company when you do not want to review its jobs. You can restore it here later.</p></div>`;for(const c of companies.slice(0,limit))html+=`<article class="excluded-row"><div><h3>${text(c.name)}</h3><p>${state.jobs.filter(j=>j.company_id===c.id).length} jobs hidden from your inbox. New jobs will stay excluded.</p>${c.note?`<p class="note-preview">${text(c.note)}</p>`:''}</div><button class="button small" data-action="restore" data-company="${text(c.id)}"${disabled()}>Restore company</button></article>`;if(companies.length>limit)html+='<div class="load-more"><button class="button" data-action="load-more">Load more companies</button></div>';$('content').innerHTML=html;}

function cardSignature(card){return card ? card.company_id+':'+card.jobs.map(j=>j.key+'@'+j.revision).join('|')+'@'+card.revision : '';}
function matchingCards(){return (state.flashcards||[]).filter(card=>matchesCompany(card.company_id)&&card.jobs.some(matchesQuery));}
function freshCard(){return currentCard&&(state.flashcards||[]).some(c=>cardSignature(c)===cardSignature(currentCard));}
function cardActionDisabled(){return !online||busy||loading||!!pendingCard||!!noteDrafts.size||!freshCard();}
function persistCard(){try{if(pendingCard)localStorage.setItem(cardKey,JSON.stringify(pendingCard));else localStorage.removeItem(cardKey);}catch{setSaveState('Request backup unavailable',true);}}
function cardJob(j,index){const d=j.data,b=d.brief||{};return `<article class="card-job" data-card-job="${text(j.key)}" data-picked="${cardSelected.has(j.key)}"><div class="card-job-top"><label class="pick-job"><input id="card-pick-${text(j.key)}" type="checkbox" data-card-select="${text(j.key)}" aria-label="Select ${text(d.title)} for approval"${cardSelected.has(j.key)?' checked':''}${cardActionDisabled()?' disabled':''}><span class="sr-only">Pick job ${index+1}</span></label><div><h3>${link(d.url,d.title)}</h3><div class="job-meta"><span>${text(d.location||'Location not listed')}</span><span>${text(b.arrangement||d.arrangement||'Work setting not confirmed.')}</span></div></div></div><dl class="brief"><dt>Work</dt><dd>${text(b.work||conciseFallback(d.why_ranked))}</dd><dt>Fit</dt><dd>${text(b.fit||conciseFallback(d.strengths))}</dd><dt>Gap</dt><dd class="gap">${text(b.gap||conciseFallback(d.gaps))}</dd></dl><details class="job-details" data-detail="card:${text(j.key)}"${openedDetails.has('card:'+j.key)?' open':''}><summary>Pay, details & sources</summary><div class="details-body"><dl class="facts"><dt>Pay</dt><dd>${text(d.salary||'Pay not listed')}</dd><dt>Job ID</dt><dd>${text(j.job_id)}</dd><dt>Rank at company</dt><dd>${text(d.rank||'Not recorded')}</dd><dt>Level</dt><dd>${text(d.level||'Not confirmed.')}</dd><dt>Why this rank</dt><dd>${text(d.why_ranked||'Not recorded.')}</dd><dt>Strengths</dt><dd>${list(d.strengths)}</dd><dt>Gaps</dt><dd>${list(d.gaps)}</dd><dt>Work setting</dt><dd>${text(d.arrangement||'Not confirmed.')}</dd><dt>Availability</dt><dd>${text(d.availability||'Check the live posting before applying.')}</dd><dt>Sources</dt><dd class="sources">${(d.sources||[]).map(s=>link(s.url,s.label||'Source')).join('')||link(d.url,'Official job posting')}</dd>${j.note?`<dt>Your note</dt><dd>${text(j.note)}</dd>`:''}</dl></div></details></article>`;}
function cardActions(){const blocked=cardActionDisabled(),count=cardSelected.size;return `<div class="card-decisions"><button class="button exclude" data-action="card-decision" data-choice="exclude" data-testid="card-exclude" aria-label="Exclude company. You can also swipe left."${blocked?' disabled':''}><span class="decision-symbol" aria-hidden="true">×</span><span>Exclude</span></button><button class="button research" data-action="card-decision" data-choice="research" data-testid="card-research"${blocked?' disabled':''}><span class="decision-symbol" aria-hidden="true">↻</span><span>Find more</span></button><button class="button approve" data-action="card-decision" data-choice="approve" data-testid="card-approve" aria-label="Approve ${count||'selected'} ${count===1?'job':'jobs'}. You can also swipe right."${blocked||!count?' disabled':''}><span class="decision-symbol" aria-hidden="true">✓</span><span>${busy?'Saving…':count?'Approve '+count:'Approve picks'}</span></button></div>`;}
function renderCardActions(){if(!currentCard)return;const container=$('card-decisions');if(container)container.innerHTML=cardActions();for(const row of document.querySelectorAll('[data-card-job]'))row.dataset.picked=String(cardSelected.has(row.dataset.cardJob));}
function renderCards(){
  if(!Array.isArray(state.flashcards)){$('content').innerHTML='<div class="empty"><h3>Refresh the local server.</h3><p>Your saved choices are safe. Other views are available now.</p><button class="button" data-view="all">Open all jobs</button></div>';return;}
  const cards=matchingCards(),history=state.card_reviews||[],last=history[0];
  if(!currentCard&&cards.length){const first=cards[0];currentCard={...first,company:{...company(first.company_id)},jobs:first.jobs.map(j=>({...j,data:{...j.data}}))};cardSelected.clear();}
  let html=search||companyFilter?`<div class="review-filter"><span>Filtered review</span><button class="button quiet small" data-action="clear-filters">Show all companies</button></div>`:'';
  if(!currentCard){const filtered=!!search||!!companyFilter;html+=`<section class="card-complete"><h2>${filtered?'No matching cards.':'All caught up.'}</h2><p>${filtered?'Clear the search to see the rest of your review.':'New jobs will appear here when added. Your choices are saved.'}</p><div class="buttons">${filtered?'<button class="button primary" data-action="clear-filters">Show all companies</button>':'<button class="button primary" data-view="ready">See saved jobs</button>'}<button class="button" data-view="all">Browse all jobs</button></div></section>`;$('content').innerHTML=html;return;}
  const c=currentCard.company,stale=!freshCard();
  html+=`<div class="review-stack"><section class="company-card" aria-label="Review ${text(c.name)}" aria-describedby="swipe-hint" data-testid="company-card"><div class="swipe-feedback" aria-hidden="true"></div><header class="card-header"><div><h2 id="card-title" tabindex="-1">${text(c.name)}</h2><p>${currentCard.jobs.length===3?'Three jobs to consider':currentCard.jobs.length+' '+(currentCard.jobs.length===1?'job':'jobs')+' to consider'}</p></div><span class="card-index">${cards.length} left</span></header><details class="card-context" data-detail="card-company:${text(c.id)}"${openedDetails.has('card-company:'+c.id)?' open':''}><summary>About this company</summary>${c.note?`<p class="user-note">${text(c.note)}</p>`:''}${c.data.summary?`<p>${text(c.data.summary)}</p>`:''}${c.data.coverage?`<p><strong>Search scope:</strong> ${text(c.data.coverage)}</p>`:''}${c.data.comparison?`<p><strong>Why these jobs:</strong> ${text(c.data.comparison)}</p>`:''}${c.data.board_url?`<p>${link(c.data.board_url,'Company job board')}</p>`:''}</details><div class="card-jobs">${currentCard.jobs.map(cardJob).join('')}</div></section></div><div class="card-bottom">${stale?'<p class="card-save-error">This card changed. <button class="button small" data-action="card-refresh">Load current card</button></p>':''}<div id="card-decisions">${cardActions()}</div><p class="decision-hint" id="swipe-hint">Swipe left to exclude. Pick jobs, then swipe right to approve.</p></div>${last?`<button class="button quiet small review-back" data-action="review-company" data-company="${text(last.company_id)}">Review last decision</button>`:''}`;
  $('content').innerHTML=html;
}
function swipeIntent(dx,dy,width){const threshold=Math.max(70,Math.min(110,width*.28));return Math.abs(dx)>=threshold&&Math.abs(dx)>Math.abs(dy)*1.4?(dx>0?'approve':'exclude'):null;}
function swipeOriginAllowed(target){return !!target?.closest&&!target.closest('a,button,input,label,textarea,select,summary,details,[contenteditable="true"],[role="button"]');}
function commitSwipe(intent){if(view!=='cards'||!['approve','exclude'].includes(intent)||cardActionDisabled())return false;if(intent==='approve'&&!cardSelected.size){setNotice('Pick at least one job before you swipe right.');return false;}submitCard(intent);return true;}
function cancelSwipe(event){if(!swipe||event&&event.pointerId!==undefined&&event.pointerId!==swipe.pointerId)return;const previous=swipe;swipe=null;previous.card.style.transform='';previous.card.classList.remove('is-dragging');delete previous.card.dataset.swipe;const feedback=previous.card.querySelector('.swipe-feedback');if(feedback)feedback.textContent='';if(previous.card.hasPointerCapture?.(previous.pointerId))previous.card.releasePointerCapture(previous.pointerId);}
function beginSwipe(event){if(swipe){if(event.pointerId!==swipe.pointerId)cancelSwipe();return;}if(view!=='cards'||cardActionDisabled()||event.isPrimary===false||event.button!==undefined&&event.button!==0||!swipeOriginAllowed(event.target))return;const card=event.target.closest('.company-card');if(!card)return;swipe={pointerId:event.pointerId,x:event.clientX,y:event.clientY,card,width:card.getBoundingClientRect().width,signature:cardSignature(currentCard),axis:null};}
function moveSwipe(event){if(!swipe||event.pointerId!==swipe.pointerId)return;if(cardActionDisabled()||swipe.signature!==cardSignature(currentCard)){cancelSwipe(event);return;}const dx=event.clientX-swipe.x,dy=event.clientY-swipe.y;if(!swipe.axis&&Math.max(Math.abs(dx),Math.abs(dy))>=9){if(Math.abs(dy)>=Math.abs(dx)){cancelSwipe(event);return;}if(Math.abs(dx)>Math.abs(dy)*1.4){swipe.axis='x';swipe.card.setPointerCapture?.(swipe.pointerId);}}if(swipe.axis!=='x')return;if(event.cancelable)event.preventDefault();const distance=Math.max(-145,Math.min(145,dx));swipe.card.classList.add('is-dragging');swipe.card.dataset.swipe=dx>0?'approve':'exclude';const reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;swipe.card.style.transform=reduced?'':`translateX(${distance}px) rotate(${distance/28}deg)`;const feedback=swipe.card.querySelector('.swipe-feedback');if(feedback)feedback.textContent=dx<0?'Exclude':cardSelected.size?'Approve '+cardSelected.size:'Pick jobs first';}
function endSwipe(event){if(!swipe||event.pointerId!==swipe.pointerId)return;const intent=swipe.axis==='x'&&swipe.signature===cardSignature(currentCard)?swipeIntent(event.clientX-swipe.x,event.clientY-swipe.y,swipe.width):null;cancelSwipe(event);if(intent)commitSwipe(intent);}
document.addEventListener('pointerdown',beginSwipe);
document.addEventListener('pointermove',moveSwipe,{passive:false});
document.addEventListener('pointerup',endSwipe);
document.addEventListener('pointercancel',cancelSwipe);
document.addEventListener('lostpointercapture',cancelSwipe);
function submitCard(action,recovery=false){
  if(busy||loading||!online)return;
  if(!recovery){
    if(pendingCard||noteDrafts.size||!currentCard||!freshCard())return;
    if(action==='approve'&&!cardSelected.size)return;
    if(!['approve','research','exclude'].includes(action))return;
    pendingCard={request_id:crypto.randomUUID(),company_id:currentCard.company_id,revision:currentCard.revision,jobs:currentCard.jobs.map(j=>({key:j.key,revision:j.revision})),action,selected:action==='approve'?currentCard.jobs.filter(j=>cardSelected.has(j.key)).map(j=>j.key):[]};persistCard();render();
  }
  if(!pendingCard)return;
  const exact=pendingCard,companyName=company(exact.company_id)?.name||'Company';
  mutation('/api/card',()=>exact,{onSuccess:()=>{pendingCard=null;persistCard();currentCard=null;cardSelected.clear();},success:()=>exact.action==='approve'?`${exact.selected.length} ${exact.selected.length===1?'job':'jobs'} at ${companyName} approved. Saved in Ready.`:exact.action==='research'?`Research requested for ${companyName}. Your previous choices are kept.`:`${companyName} excluded. Its history is kept.`}).then(ok=>{
    if(ok){requestAnimationFrame(()=>{$('card-title')?.focus({preventScroll:true});$('main').scrollIntoView({block:'start'});});}
    else if(online){pendingCard=null;persistCard();render();}
  });
}

async function readState(){const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw new Error(`The inbox could not load (${response.status}).`);const next=await response.json();if(!Array.isArray(next.companies)||!Array.isArray(next.jobs)||!Array.isArray(next.queue)||!next.token)throw new Error('The server returned an incomplete inbox.');state=next;online=true;return next;}
function refresh({initial=false}={}){if(busy||loading)return chain;loading=true;$('refresh').disabled=true;setSaveState('Refreshing…');render();const task=async()=>{try{await readState();for(const [key,value] of noteDrafts){const item=key.startsWith('job:')?job(key.slice(4)):company(key.slice(8));if(item&&(item.note||'')===value)clearDraft(key);}if(!initial)setNotice('Feed refreshed. Your saved choices are kept.','success');setSaveState(noteDrafts.size?'Unsaved notes':'Saved on this computer');render();if(initial&&Number(savedView.scroll)>0)requestAnimationFrame(()=>window.scrollTo(0,Number(savedView.scroll)));}catch(error){online=false;setSaveState('Connection lost',true);setNotice(error.message+' Your saved choices stay on the server. Reconnect, then select Refresh feed.');if(state)render();else $('content').innerHTML='<div class="empty"><h3>The inbox is not connected.</h3><p>Keep the local job review server running. Then select Refresh feed. You can review your saved choices when the connection returns.</p></div>';}finally{loading=false;$('refresh').disabled=busy;render();}};chain=chain.then(task,task);return chain;}
function mutation(path,build,{success,onSuccess}={}){const scheduledGeneration=generation;const task=async()=>{if(scheduledGeneration!==generation)return false;if(!online){setNotice('Reconnect and refresh before you save a change.');return false;}busy=true;setSaveState('Saving…');render();try{const payload=build();if(!payload)return false;const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':state.token},body:JSON.stringify(payload)});let result;try{result=await response.json();}catch{throw new Error('The server did not confirm this change.');}if(!response.ok){const err=new Error(result.error||`This change could not be saved (${response.status}).`);err.status=response.status;throw err;}if(!Array.isArray(result.jobs)||!result.token)throw new Error('The server did not return the saved state.');state=result;online=true;onSuccess?.(result);setSaveState('Saved on this computer');if(success)setNotice(typeof success==='function'?success():success,'success');return true;}catch(error){generation++;if(error.status===409){try{await readState();setSaveState('Review changed item',true);setNotice('This item changed in another view. Current data is loaded. Check it, then save your choice again. '+error.message);}catch{online=false;setSaveState('Connection lost',true);setNotice('This item changed, but the current data could not load. Refresh before you continue.');}}else if(error.status){setSaveState('Change not saved',true);setNotice(error.message);}else{online=false;setSaveState('Save not confirmed',true);setNotice('The connection stopped before this change was confirmed. It may have saved. Refresh before you continue.');}return false;}finally{busy=false;render();}};chain=chain.then(task,task);return chain;}
function changeView(next){if(!views.includes(next))return;browseOpen=false;if(next==='cards'&&view!=='cards'){currentCard=null;cardSelected.clear();}view=next;limit=20;preview=null;persistView();render();$('main').scrollIntoView({block:'start'});}
function resetFilters(){search='';companyFilter='';currentCard=null;cardSelected.clear();$('search').value='';limit=20;preview=null;persistView();render();}
function noteValue(kind,id,fallback){return noteDrafts.get(kind+':'+id)??fallback??'';}
function clearNoteTimer(kind,id){const k=kind+':'+id;clearTimeout(noteTimers.get(k));noteTimers.delete(k);}
function saveNote(kind,id,value){const k=kind+':'+id;const entity=kind==='job'?job(id):company(id);if(!entity||value===(entity.note||'')){clearDraft(k);renderNotice();return;}const revision=noteRevisions.get(k)??entity.revision;mutation(kind==='job'?'/api/job':'/api/company',()=>{const current=kind==='job'?job(id):company(id);if(!current)throw new Error('This item is no longer available.');return kind==='job'?{key:id,revision,decision:current.decision,note:value}:{id,revision,excluded:current.excluded,note:value};},{onSuccess:()=>acceptNoteSave(k,value)});}
function submitQueue(recovery=false){if(busy||!online||loading)return;if(noteDrafts.size){setNotice('Save or discard unsaved notes before you queue jobs.');return;}if(!recovery){if(!preview?.length)return;pendingQueue={request_id:crypto.randomUUID(),jobs:preview.map(p=>({key:p.key,revision:p.revision}))};persistPending();}if(!pendingQueue)return;const exact=pendingQueue;mutation('/api/queue',()=>exact,{success:()=>`${exact.jobs.length} ${exact.jobs.length===1?'job is':'jobs are'} saved to the queue. Return to this chat when you want to start.`,onSuccess:()=>{for(const p of exact.jobs)selected.delete(p.key);pendingQueue=null;persistPending();preview=null;view='queue';limit=20;persistView();}}).then(ok=>{if(!ok&&online){pendingQueue=null;persistPending();renderNotice();}});}
$('search').value=search;
$('search').addEventListener('input',event=>{search=event.target.value;currentCard=null;cardSelected.clear();limit=20;preview=null;persistView();render();});
$('company-filter').addEventListener('change',event=>{companyFilter=event.target.value;currentCard=null;cardSelected.clear();limit=20;preview=null;persistView();render();});
$('refresh').addEventListener('click',()=>{currentCard=null;cardSelected.clear();refresh();});
document.addEventListener('toggle',event=>{const key=event.target.dataset?.detail;if(key){if(event.target.open)openedDetails.add(key);else openedDetails.delete(key);}},true);
document.addEventListener('input',event=>{const field=event.target;if(!field.dataset.noteKind)return;const kind=field.dataset.noteKind,id=field.dataset.noteId,k=kind+':'+id;if(!noteDrafts.has(k)){const entity=kind==='job'?job(id):company(id);noteRevisions.set(k,entity.revision);}noteDrafts.set(k,field.value);persistNotes();clearNoteTimer(kind,id);setSaveState('Saving note…');noteTimers.set(k,setTimeout(()=>{noteTimers.delete(k);saveNote(kind,id,noteDrafts.get(k)??field.value);},800));});
document.addEventListener('change',event=>{const field=event.target;if(field.dataset.cardSelect){if(field.checked)cardSelected.add(field.dataset.cardSelect);else cardSelected.delete(field.dataset.cardSelect);renderCardActions();return;}if(field.dataset.select){if(field.checked)selected.add(field.dataset.select);else selected.delete(field.dataset.select);preview=null;render();}});
document.addEventListener('click',event=>{const el=event.target.closest('button[data-action],button[data-view]');if(!el||el.disabled)return;if(el.dataset.view){changeView(el.dataset.view);return;}const action=el.dataset.action;if(['decision','exclude','restore','research','cancel','queue','recover-queue','save-notes','card-decision','recover-card'].includes(action)&&(busy||loading||!online))return;
  if(action==='toggle-browse'){browseOpen=!browseOpen;renderNav();return;}
  if(action==='card-decision'){submitCard(el.dataset.choice);return;}
  if(action==='recover-card'){submitCard(null,true);return;}
  if(action==='card-refresh'){currentCard=null;cardSelected.clear();refresh();return;}
  if(action==='review-company'){companyFilter=el.dataset.company;search='';$('search').value='';changeView('all');return;}
  if(action==='save-notes'){for(const [key,value] of [...noteDrafts]){const kind=key.startsWith('job:')?'job':'company',id=key.slice(kind==='job'?4:8),item=kind==='job'?job(id):company(id);clearNoteTimer(kind,id);if(item){noteRevisions.set(key,item.revision);saveNote(kind,id,value);}}persistNotes();return;}
  if(action==='discard-notes'){for(const timer of noteTimers.values())clearTimeout(timer);noteTimers.clear();noteDrafts.clear();noteRevisions.clear();persistNotes();setSaveState('Saved on this computer');render();return;}
  if(action==='dismiss'){notice=null;renderNotice();return;}
  if(action==='load-more'){limit+=20;persistView();render();return;}
  if(action==='clear-filters'){resetFilters();return;}
  if(action==='select-visible'){visibleJobs().slice(0,limit).forEach(j=>selected.add(j.key));preview=null;render();return;}
  if(action==='clear-selected'){selected.clear();preview=null;render();return;}
  if(action==='preview'){if(noteDrafts.size){setNotice('Save or discard unsaved notes before you queue jobs.');return;}preview=[...selected].map(key=>({key,revision:job(key).revision}));render();$('queue-preview')?.focus({preventScroll:true});$('queue-preview')?.scrollIntoView({block:'center'});return;}
  if(action==='close-preview'){preview=null;render();return;}
  if(action==='queue'){submitQueue();return;}
  if(action==='recover-queue'){submitQueue(true);return;}
  if(action==='decision'){const key=el.dataset.key,decision=el.dataset.decision,shownRevision=noteRevisions.get('job:'+key)??job(key).revision;clearNoteTimer('job',key);let savedNote;mutation('/api/job',()=>{const current=job(key);savedNote=noteValue('job',key,current.note);return {key,revision:shownRevision,decision,note:savedNote};},{onSuccess:()=>acceptNoteSave('job:'+key,savedNote),success:decision==='approve'?'Job approved. Choose it in Ready when you want to queue it.':decision==='later'?'Job saved in Later.':decision==='pass'?'Job passed. It is still available in All jobs.':'Job returned to the inbox.'});return;}
  if(action==='exclude'||action==='restore'){const id=el.dataset.company,shownRevision=noteRevisions.get('company:'+id)??company(id).revision;clearNoteTimer('company',id);let savedNote;mutation('/api/company',()=>{const current=company(id);savedNote=noteValue('company',id,current.note);return {id,revision:shownRevision,excluded:action==='exclude',note:savedNote};},{onSuccess:()=>acceptNoteSave('company:'+id,savedNote),success:action==='exclude'?'Company excluded. Its queued jobs were cancelled. You can restore it from Excluded.':'Company restored. Cancelled jobs stay in the queue history.'});return;}
  if(action==='research'){const id=el.dataset.company,shownRevision=noteRevisions.get('company:'+id)??company(id).revision;mutation('/api/research',()=>{const current=company(id);return {id,revision:shownRevision,note:noteValue('company',id,current.note)};},{success:'Research request saved. You can still review this company’s jobs.'});return;}
  if(action==='cancel'){mutation('/api/cancel',()=>({id:el.dataset.queueId}),{success:'Queue item cancelled. Its history is kept.'});return;}
});

window.addEventListener('pagehide',persistView);
